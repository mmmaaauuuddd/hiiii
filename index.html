<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soep van de dag</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
      touch-action: none;
    }
    canvas {
      display: block;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      text-align: center;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #ff7a1a;
      transition: opacity 0.8s;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint">Beweeg je cursor over de letters</div>

  <script>
    const canvas = document.getElementById("c");
    const hint = document.getElementById("hint");
    const gl = canvas.getContext("webgl", { alpha: false, antialias: false });

    const FONT = "Helvetica, Arial, sans-serif";
    const TITEL = ["Soep", "van de", "dag"];
    const WOORDEN = ["maandag", "dinsdag", "woensdag", "donderdag"];

    // Instellingen (in seconden)
    const GOLFTIJD = 5;       // zo lang kun je met de letters spelen
    const VERDAMPTIJD = 3.5;  // zo lang duurt het verdampen
    const INTROTIJD = 3;      // zo lang duurt het verschijnen van de dagen
    const MAX_GOLVEN = 12;

    const VERT = `
      attribute vec2 aPos;
      void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
    `;

    const FRAG = `
      #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
      #else
      precision mediump float;
      #endif

      uniform sampler2D uTex;
      uniform vec2 uRes;
      uniform float uDpr;
      uniform float uTime;
      uniform float uAmbient;
      uniform float uVanish;
      uniform float uRise;
      uniform vec4 uRip[${MAX_GOLVEN}];

      // Kleur van de letters (oranje)
      const vec3 ORANJE = vec3(1.0, 0.48, 0.10);

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                   mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
      }

      void main() {
        vec2 pos = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uDpr;
        vec2 d = vec2(0.0);

        // Zachte, langzame golving door het hele woord
        d.x += uAmbient * (sin(pos.x * 0.008 + pos.y * 0.011 + uTime * 1.3) * 0.6
                         + sin(pos.y * 0.02 - uTime * 1.9) * 0.4);
        d.y += uAmbient * 0.7 * (cos(pos.x * 0.012 - uTime * 1.5) * 0.5
                               + sin(pos.y * 0.007 + pos.x * 0.006 + uTime) * 0.5);

        // Golven die vanaf de cursor uitwaaieren
        for (int i = 0; i < ${MAX_GOLVEN}; i++) {
          vec4 r = uRip[i];
          float age = uTime - r.z;
          if (age < 0.0 || age > 3.5) continue;
          vec2 v = pos - r.xy;
          float dist = length(v);
          float ring = dist - age * 240.0;
          float env = exp(-ring * ring / (2.0 * 80.0 * 80.0));
          float life = 1.0 - age / 3.5;
          float s = sin(ring * 0.05) * env * r.w * life * life;
          d += v / max(dist, 1.0) * s;
        }

        // Verdampen / condenseren: zacht, met ruis en wazigheid
        float n = noise(pos * 0.006 + vec2(0.0, uTime * 0.3)) * 0.65
                + noise(pos * 0.015 - vec2(uTime * 0.2, 0.0)) * 0.35;
        float cp = smoothstep(0.0, 1.0, clamp(uVanish * 1.7 - n * 0.7, 0.0, 1.0));
        d.y += cp * cp * uRise;
        d.x += sin(pos.y * 0.03 + uTime * 2.0) * cp * 18.0;

        vec2 sp = pos + d;
        float br = cp * 14.0;

        // Zachte blur die toeneemt tijdens het verdampen
        float a = 0.0;
        for (int i = 0; i < 9; i++) {
          vec2 o = vec2(0.0);
          if (i > 0) {
            float ang = float(i) * 0.785398;
            o = vec2(cos(ang), sin(ang)) * br;
          }
          a += texture2D(uTex, (sp + o) * uDpr / uRes).a;
        }
        a /= 9.0;

        float alpha = a * (1.0 - cp);
        gl_FragColor = vec4(mix(vec3(1.0), ORANJE, alpha), 1.0);
      }
    `;

    if (!gl) {
      hint.textContent = "Je browser ondersteunt WebGL niet.";
    } else {
      start();
    }

    function start() {
      function maakShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, maakShader(gl.VERTEX_SHADER, VERT));
      gl.attachShader(prog, maakShader(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const aPos = gl.getAttribLocation(prog, "aPos");
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      const U = {};
      ["uTex", "uRes", "uDpr", "uTime", "uAmbient", "uVanish", "uRise", "uRip"].forEach(function (n) {
        U[n] = gl.getUniformLocation(prog, n);
      });

      let W, H, dpr, texTitel, texWoorden;
      let t0 = null;
      const golven = [];
      const ripData = new Float32Array(MAX_GOLVEN * 4);
      let laatste = { x: -999, y: -999, t: 0 };

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

      function maakTextuur(regels) {
        const c = document.createElement("canvas");
        c.width = Math.round(W * dpr);
        c.height = Math.round(H * dpr);
        const g = c.getContext("2d");
        g.setTransform(dpr, 0, 0, dpr, 0, 0);

        const LH = 0.95;
        g.font = "700 100px " + FONT;
        let breedste = 0;
        regels.forEach(function (r) {
          breedste = Math.max(breedste, g.measureText(r).width);
        });
        const maat = Math.min(
          (W * 0.92) / breedste * 100,
          (H * 0.92) / (regels.length * LH)
        );

        g.font = "700 " + maat + "px " + FONT;
        g.fillStyle = "#000";
        g.textAlign = "center";
        g.textBaseline = "middle";
        regels.forEach(function (r, i) {
          const y = H / 2 + (i - (regels.length - 1) / 2) * maat * LH;
          g.fillText(r, W / 2, y);
        });

        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return tex;
      }

      function init() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        gl.viewport(0, 0, canvas.width, canvas.height);
        texTitel = maakTextuur(TITEL);
        texWoorden = maakTextuur(WOORDEN);
      }

      function frame(ts) {
        const now = ts / 1000;
        const el = t0 === null ? 0 : now - t0;

        let tex = texTitel;
        let ambient = 0;
        let vanish = 0;
        let rise = 120;
        const smelt = clamp(el / GOLFTIJD, 0, 1);

        if (el < GOLFTIJD) {
          ambient = smelt * smelt * 28;
        } else if (el < GOLFTIJD + VERDAMPTIJD) {
          vanish = (el - GOLFTIJD) / VERDAMPTIJD;
          ambient = 28 + vanish * 14;
        } else {
          tex = texWoorden;
          const intro = clamp((el - GOLFTIJD - VERDAMPTIJD) / INTROTIJD, 0, 1);
          vanish = 1 - intro;
          rise = -80;
          ambient = (1 - intro) * (1 - intro) * 24;
        }

        // Golven doorgeven aan de shader
        ripData.fill(0);
        for (let i = 0; i < MAX_GOLVEN; i++) ripData[i * 4 + 2] = -1000;
        for (let i = 0; i < golven.length; i++) {
          const g = golven[i];
          ripData[i * 4] = g.x;
          ripData[i * 4 + 1] = g.y;
          ripData[i * 4 + 2] = g.t;
          ripData[i * 4 + 3] = 9 * (1 + smelt * 1.6);
        }

        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.uniform1i(U.uTex, 0);
        gl.uniform2f(U.uRes, canvas.width, canvas.height);
        gl.uniform1f(U.uDpr, dpr);
        gl.uniform1f(U.uTime, now);
        gl.uniform1f(U.uAmbient, ambient);
        gl.uniform1f(U.uVanish, vanish);
        gl.uniform1f(U.uRise, rise);
        gl.uniform4fv(U.uRip, ripData);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        requestAnimationFrame(frame);
      }

      window.addEventListener("pointermove", function (e) {
        const now = performance.now() / 1000;
        if (t0 === null) {
          t0 = now;
          hint.style.opacity = 0;
        }
        const afstand = Math.hypot(e.clientX - laatste.x, e.clientY - laatste.y);
        if (afstand > 14 && now - laatste.t > 0.06) {
          golven.push({ x: e.clientX, y: e.clientY, t: now });
          if (golven.length > MAX_GOLVEN) golven.shift();
          laatste = { x: e.clientX, y: e.clientY, t: now };
        }
      });

      let resizeTimer;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(init, 200);
      });

      init();
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
