<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soepen</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ffb877;
      touch-action: none;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    const FONT = "Helvetica, Arial, sans-serif";
    const WOORDEN = ["maandag", "dinsdag", "woensdag", "donderdag"];
    const ALFABET = "abcdefghijklmnopqrstuvwxyz";
    const RADIUS = 170; // hoe groot het "blaasgebied" rond de cursor is

    let W, H, dpr;
    let letters = [];
    let ruisTotaal = 0;
    let ruisOver = 0;

    const muis = { x: 0, y: 0, vx: 0, vy: 0, actief: false };

    function init() {
      dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      letters = [];

      // De letters van de vier woorden: ze beginnen verspreid
      // en vinden pas hun plek als de rest weg is.
      const maat = Math.max(26, Math.min(W / 10, 96));
      ctx.font = "700 " + maat + "px " + FONT;
      const regel = maat * 1.05;
      const startY = H / 2 - ((WOORDEN.length - 1) * regel) / 2;

      WOORDEN.forEach(function (woord, i) {
        const tekens = woord.split("");
        const breedtes = tekens.map(function (c) { return ctx.measureText(c).width; });
        const totaal = breedtes.reduce(function (a, b) { return a + b; }, 0);
        let x = W / 2 - totaal / 2;

        tekens.forEach(function (c, j) {
          letters.push({
            char: c,
            x: Math.random() * W,
            y: Math.random() * H,
            vx: 0, vy: 0,
            a: (Math.random() - 0.5) * Math.PI * 2,
            va: 0,
            size: maat,
            woord: true,
            hx: x + breedtes[j] / 2,
            hy: startY + i * regel
          });
          x += breedtes[j];
        });
      });

      // De losse letters die weggeveegd moeten worden
      const aantal = Math.round((W * H) / 2600);
      for (let i = 0; i < aantal; i++) {
        letters.push({
          char: ALFABET[Math.floor(Math.random() * ALFABET.length)],
          x: Math.random() * W,
          y: Math.random() * H,
          vx: 0, vy: 0,
          a: (Math.random() - 0.5) * Math.PI * 2,
          va: 0,
          size: maat * (0.35 + Math.random() * 0.8),
          woord: false
        });
      }
      ruisTotaal = aantal;
      ruisOver = aantal;
    }

    function stap() {
      // Hoe meer losse letters weg zijn, hoe sterker de woorden naar hun plek trekken
      const voortgang = Math.min(1, (1 - ruisOver / ruisTotaal) / 0.95);
      const veer = 0.014 * voortgang * voortgang * voortgang;
      const wrijvingWoord = 0.95 - 0.08 * voortgang;

      muis.vx *= 0.85;
      muis.vy *= 0.85;

      for (let i = letters.length - 1; i >= 0; i--) {
        const l = letters[i];

        // Cursor duwt de letters weg, het sterkst vlak bij de cursor
        if (muis.actief) {
          const dx = l.x - muis.x;
          const dy = l.y - muis.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < RADIUS * RADIUS && d2 > 0.01) {
            const d = Math.sqrt(d2);
            const f = 1 - d / RADIUS;
            const sterkte = f * f;
            l.vx += (dx / d) * sterkte * 2.5 + muis.vx * sterkte * 0.12;
            l.vy += (dy / d) * sterkte * 2.5 + muis.vy * sterkte * 0.12;
            l.va += (Math.random() - 0.5) * 0.14 * sterkte;
          }
        }

        // Woordletters veren terug naar hun plek in het woord
        if (l.woord) {
          l.vx += (l.hx - l.x) * veer;
          l.vy += (l.hy - l.y) * veer;
          l.a = ((((l.a + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) - Math.PI;
          l.va += -l.a * veer * 3;
        }

        // Maximale snelheid
        const snelheid = Math.hypot(l.vx, l.vy);
        if (snelheid > 35) {
          l.vx = (l.vx / snelheid) * 35;
          l.vy = (l.vy / snelheid) * 35;
        }

        const wrijving = l.woord ? wrijvingWoord : 0.95;
        l.vx *= wrijving;
        l.vy *= wrijving;
        l.va *= 0.92;

        l.x += l.vx;
        l.y += l.vy;
        l.a += l.va;

        if (l.woord) {
          // Woordletters blijven in beeld
          if (l.x < 0) { l.x = 0; l.vx *= -0.5; }
          if (l.x > W) { l.x = W; l.vx *= -0.5; }
          if (l.y < 0) { l.y = 0; l.vy *= -0.5; }
          if (l.y > H) { l.y = H; l.vy *= -0.5; }
        } else if (l.x < -100 || l.x > W + 100 || l.y < -100 || l.y > H + 100) {
          // Losse letters die het scherm uit zijn, verdwijnen
          letters.splice(i, 1);
          ruisOver--;
        }
      }
    }

    function teken() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (let i = 0; i < letters.length; i++) {
        const l = letters[i];
        const c = Math.cos(l.a);
        const s = Math.sin(l.a);
        ctx.setTransform(c * dpr, s * dpr, -s * dpr, c * dpr, l.x * dpr, l.y * dpr);
        ctx.font = "700 " + Math.round(l.size) + "px " + FONT;
        ctx.fillText(l.char, 0, 0);
      }
    }

    function loop() {
      stap();
      teken();
      requestAnimationFrame(loop);
    }

    // Cursor en touch
    window.addEventListener("pointermove", function (e) {
      if (muis.actief) {
        muis.vx = muis.vx * 0.5 + (e.clientX - muis.x) * 0.5;
        muis.vy = muis.vy * 0.5 + (e.clientY - muis.y) * 0.5;
      }
      muis.x = e.clientX;
      muis.y = e.clientY;
      muis.actief = true;
    });

    window.addEventListener("pointerdown", function (e) {
      muis.x = e.clientX;
      muis.y = e.clientY;
      muis.actief = true;
    });

    window.addEventListener("pointerup", function (e) {
      if (e.pointerType === "touch") muis.actief = false;
    });

    document.documentElement.addEventListener("mouseleave", function () {
      muis.actief = false;
    });

    let resizeTimer;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(init, 200);
    });

    init();
    loop();
  </script>
</body>
</html>
