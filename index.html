<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soep van de dag</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
      touch-action: none;
    }
    canvas {
      display: block;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      text-align: center;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #999;
      transition: opacity 0.8s;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint">Beweeg je cursor over de letters</div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const hint = document.getElementById("hint");

    const FONT = "Helvetica, Arial, sans-serif";
    const TITEL = ["Soep", "van de", "dag"];
    const WOORDEN = ["maandag", "dinsdag", "woensdag", "donderdag"];

    // Instellingen (in seconden)
    const GOLFTIJD = 5;       // zo lang kun je met de letters spelen
    const VERDAMPTIJD = 3;    // zo lang duurt het verdampen
    const INTROTIJD = 2.5;    // zo lang duurt het zichtbaar worden van de dagen
    const RIPPLE_LEVEN = 3;   // hoe lang een golf blijft bestaan

    let W, H, dpr, cell, nx, ny, hash;
    let titelBron, woordenBron;
    let t0 = null;
    const golven = [];
    let laatste = { x: -999, y: -999 };

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    // Tekent de regels groot op een apart canvas
    function maakBron(regels) {
      const c = document.createElement("canvas");
      c.width = W * dpr;
      c.height = H * dpr;
      const g = c.getContext("2d");
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.fillStyle = "#fff";
      g.fillRect(0, 0, W, H);

      const LH = 0.95;
      g.font = "700 100px " + FONT;
      let breedste = 0;
      regels.forEach(function (r) {
        breedste = Math.max(breedste, g.measureText(r).width);
      });
      const maat = Math.min(
        (W * 0.92) / breedste * 100,
        (H * 0.92) / (regels.length * LH)
      );

      g.font = "700 " + maat + "px " + FONT;
      g.fillStyle = "#111";
      g.textAlign = "center";
      g.textBaseline = "middle";
      regels.forEach(function (r, i) {
        const y = H / 2 + (i - (regels.length - 1) / 2) * maat * LH;
        g.fillText(r, W / 2, y);
      });
      return c;
    }

    function init() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";

      cell = Math.max(8, Math.round(W / 150));
      nx = Math.ceil(W / cell);
      ny = Math.ceil(H / cell);
      hash = new Float32Array(nx * ny);
      for (let i = 0; i < hash.length; i++) hash[i] = Math.random();

      titelBron = maakBron(TITEL);
      woordenBron = maakBron(WOORDEN);
    }

    function frame(ts) {
      const now = ts / 1000;
      const el = t0 === null ? 0 : now - t0;

      // Welke fase zitten we in?
      let bron = titelBron;
      let modus = "titel";
      let ambient = 0;
      let evap = 0;
      let intro = 0;
      const smelt = clamp(el / GOLFTIJD, 0, 1);

      if (el < GOLFTIJD) {
        ambient = smelt * smelt * 60;
      } else if (el < GOLFTIJD + VERDAMPTIJD) {
        modus = "verdampen";
        evap = (el - GOLFTIJD) / VERDAMPTIJD;
        ambient = 60 + evap * 30;
      } else {
        modus = "woorden";
        bron = woordenBron;
        intro = clamp((el - GOLFTIJD - VERDAMPTIJD) / INTROTIJD, 0, 1);
        ambient = (1 - intro) * (1 - intro) * 50;
      }

      // Verlopen golven opruimen
      for (let i = golven.length - 1; i >= 0; i--) {
        if (now - golven[i].t > RIPPLE_LEVEN) golven.splice(i, 1);
      }
      const nG = golven.length;
      const gx = new Float32Array(nG);
      const gy = new Float32Array(nG);
      const gAmp = new Float32Array(nG);
      const gFront = new Float32Array(nG);
      for (let k = 0; k < nG; k++) {
        const age = now - golven[k].t;
        gx[k] = golven[k].x;
        gy[k] = golven[k].y;
        gAmp[k] = 24 * Math.pow(1 - age / RIPPLE_LEVEN, 1.5) * (1 + smelt * 1.5);
        gFront[k] = age * 320;
      }

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cd = cell * dpr;
      for (let j = 0; j < ny; j++) {
        const y = j * cell;
        const cy = y + cell / 2;
        for (let i = 0; i < nx; i++) {
          const x = i * cell;
          const cx = x + cell / 2;
          const h = hash[j * nx + i];
          let dx = 0;
          let dy = 0;

          // Golfbeweging door het hele woord
          if (ambient > 0) {
            dx += ambient * (Math.sin(cx * 0.012 + cy * 0.017 + now * 2.1) * 0.6 +
                             Math.sin(cy * 0.03 - now * 3.1) * 0.4);
            dy += ambient * 0.8 * (Math.cos(cx * 0.02 - now * 2.4) * 0.5 +
                                   Math.sin(cy * 0.011 + cx * 0.009 + now * 1.6) * 0.5);
          }

          // Golven vanaf de cursor
          for (let k = 0; k < nG; k++) {
            const ddx = cx - gx[k];
            const ddy = cy - gy[k];
            const d = Math.sqrt(ddx * ddx + ddy * ddy);
            const ring = d - gFront[k];
            if (ring > 200 || ring < -200) continue;
            const env = Math.exp(-(ring * ring) / (2 * 70 * 70));
            const s = Math.sin(ring * 0.14) * env * gAmp[k];
            if (d > 1) {
              dx += (ddx / d) * s;
              dy += (ddy / d) * s;
            }
          }

          // Verdampen of verschijnen
          let a = 1;
          if (modus === "verdampen") {
            const cp = clamp((evap - h * 0.5) / 0.5, 0, 1);
            a = 1 - cp;
            dy += cp * cp * 140;
            dx += Math.sin(cy * 0.05 + now * 3) * cp * 30;
          } else if (modus === "woorden") {
            a = clamp((intro - h * 0.5) / 0.5, 0, 1);
            dy += (1 - a) * (1 - a) * 60;
          }

          if (a <= 0.003) continue;
          ctx.globalAlpha = a;
          ctx.drawImage(bron, (x + dx) * dpr, (y + dy) * dpr, cd, cd,
                        x * dpr, y * dpr, cd, cd);
        }
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }

    window.addEventListener("pointermove", function (e) {
      const now = performance.now() / 1000;
      if (t0 === null) {
        t0 = now;
        hint.style.opacity = 0;
      }
      const afstand = Math.hypot(e.clientX - laatste.x, e.clientY - laatste.y);
      if (afstand > 20) {
        golven.push({ x: e.clientX, y: e.clientY, t: now });
        if (golven.length > 60) golven.shift();
        laatste = { x: e.clientX, y: e.clientY };
      }
    });

    let resizeTimer;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(init, 200);
    });

    init();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
