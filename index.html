<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soep van de dag</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
      touch-action: none;
    }
    canvas {
      display: block;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      text-align: center;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #ff7a1a;
      transition: opacity 0.8s;
      pointer-events: none;
    }

    /* Informatie naast de dag waarover je hovert */
    .info {
      position: fixed;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      color: #ff7a1a;
      opacity: 0;
      transition: opacity 0.4s, top 0.3s;
      pointer-events: none;
    }
    .info.aan {
      opacity: 1;
    }
    .info b {
      display: block;
      font-size: 18px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint">Beweeg je cursor over de letters</div>
  <div class="info" id="infoL"></div>
  <div class="info" id="infoR"></div>

  <script>
    const canvas = document.getElementById("c");
    const hint = document.getElementById("hint");
    const infoL = document.getElementById("infoL");
    const infoR = document.getElementById("infoR");
    const gl = canvas.getContext("webgl", { alpha: false, antialias: false });

    const FONT = "Helvetica, Arial, sans-serif";
    const TITEL = ["Soep", "van de", "dag"];
    const WOORDEN = ["maandag", "dinsdag", "woensdag", "donderdag"];

    const INFO = [
      { naam: "Spinaziesoep", prijs: "€1,70", smaak: "3,5/5",
        tekst: "De soep was redelijk dik met wat brokjes in." },
      { naam: "Paprikasoep", prijs: "€1,70", smaak: "4,5/5",
        tekst: "Een heerlijke, zachte soep." },
      { naam: "Paprikasoep", prijs: "€2,70", smaak: "4,5/5",
        tekst: "Dezelfde soep als dinsdag, deze keer een grote omdat ik het zeer lekker vond." },
      { naam: "Knolseldersoep", prijs: "€1,70", smaak: "4/5",
        tekst: "Verrassend lekker, maar na een tijdje wat pikant." }
    ];

    // Instellingen (in seconden)
    const GOLFTIJD = 5;       // zo lang kun je met de letters spelen
    const VERDAMPTIJD = 3.5;  // zo lang duurt het verdampen
    const INTROTIJD = 2.5;    // zo lang duurt het verschijnen van de dagen
    const GOLFSTOP = 2;       // golven stoppen na zoveel seconden bij de dagen
    const MAX_GOLVEN = 12;
    const DAGSTART = GOLFTIJD + VERDAMPTIJD;

    const VERT = `
      attribute vec2 aPos;
      void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
    `;

    const FRAG = `
      #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
      #else
      precision mediump float;
      #endif

      uniform sampler2D uTex;
      uniform vec2 uRes;
      uniform float uDpr;
      uniform float uTime;
      uniform float uAmbient;
      uniform float uVanish;
      uniform float uRise;
      uniform vec3 uBand;   // bovenkant, hoogte per regel, aan/uit
      uniform vec4 uOp;     // doorzichtigheid per dag
      uniform vec4 uRip[${MAX_GOLVEN}];

      // Kleur van de letters (oranje)
      const vec3 ORANJE = vec3(1.0, 0.48, 0.10);

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                   mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
      }

      void main() {
        vec2 pos = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uDpr;
        vec2 d = vec2(0.0);

        // Zachte, langzame golving door het hele woord
        d.x += uAmbient * (sin(pos.x * 0.008 + pos.y * 0.011 + uTime * 1.3) * 0.6
                         + sin(pos.y * 0.02 - uTime * 1.9) * 0.4);
        d.y += uAmbient * 0.7 * (cos(pos.x * 0.012 - uTime * 1.5) * 0.5
                               + sin(pos.y * 0.007 + pos.x * 0.006 + uTime) * 0.5);

        // Golven die vanaf de cursor uitwaaieren
        for (int i = 0; i < ${MAX_GOLVEN}; i++) {
          vec4 r = uRip[i];
          float age = uTime - r.z;
          if (age < 0.0 || age > 3.5) continue;
          vec2 v = pos - r.xy;
          float dist = length(v);
          float ring = dist - age * 240.0;
          float env = exp(-ring * ring / (2.0 * 80.0 * 80.0));
          float life = 1.0 - age / 3.5;
          float s = sin(ring * 0.05) * env * r.w * life * life;
          d += v / max(dist, 1.0) * s;
        }

        // Verdampen / condenseren: zacht, met ruis en wazigheid
        float n = noise(pos * 0.006 + vec2(0.0, uTime * 0.3)) * 0.65
                + noise(pos * 0.015 - vec2(uTime * 0.2, 0.0)) * 0.35;
        float cp = smoothstep(0.0, 1.0, clamp(uVanish * 1.7 - n * 0.7, 0.0, 1.0));
        d.y += cp * cp * uRise;
        d.x += sin(pos.y * 0.03 + uTime * 2.0) * cp * 18.0;

        vec2 sp = pos + d;
        float br = cp * 14.0;

        // Zachte blur die toeneemt tijdens het verdampen
        float a = 0.0;
        for (int i = 0; i < 9; i++) {
          vec2 o = vec2(0.0);
          if (i > 0) {
            float ang = float(i) * 0.785398;
            o = vec2(cos(ang), sin(ang)) * br;
          }
          a += texture2D(uTex, (sp + o) * uDpr / uRes).a;
        }
        a /= 9.0;

        // Per dag een eigen doorzichtigheid (voor het hover-effect)
        float op = 1.0;
        if (uBand.z > 0.5) {
          float idx = floor((sp.y - uBand.x) / uBand.y);
          if (idx < 0.5) op = uOp.x;
          else if (idx < 1.5) op = uOp.y;
          else if (idx < 2.5) op = uOp.z;
          else op = uOp.w;
        }

        float alpha = a * (1.0 - cp) * op;
        gl_FragColor = vec4(mix(vec3(1.0), ORANJE, alpha), 1.0);
      }
    `;

    if (!gl) {
      hint.textContent = "Je browser ondersteunt WebGL niet.";
    } else {
      start();
    }

    function start() {
      function maakShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, maakShader(gl.VERTEX_SHADER, VERT));
      gl.attachShader(prog, maakShader(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const aPos = gl.getAttribLocation(prog, "aPos");
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      const U = {};
      ["uTex", "uRes", "uDpr", "uTime", "uAmbient", "uVanish", "uRise", "uBand", "uOp", "uRip"].forEach(function (n) {
        U[n] = gl.getUniformLocation(prog, n);
      });

      const LH = 0.95;
      let W, H, dpr, texTitel, texWoorden;
      let bandTop = 0, bandLh = 1, smal = false;
      let t0 = null;
      let hover = -1;
      let hintGezet = false;
      const golven = [];
      const ripData = new Float32Array(MAX_GOLVEN * 4);
      const opNu = [1, 1, 1, 1];
      let laatste = { x: -999, y: -999, t: 0 };

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

      // Berekent de lettergrootte zodat de regels in het scherm passen
      function bereken(regels, breedteDeel) {
        const g = document.createElement("canvas").getContext("2d");
        g.font = "700 100px " + FONT;
        let breedste = 0;
        regels.forEach(function (r) {
          breedste = Math.max(breedste, g.measureText(r).width);
        });
        const maat = Math.min(
          (W * breedteDeel) / breedste * 100,
          (H * 0.92) / (regels.length * LH)
        );
        return { maat: maat, breedte: breedste * maat / 100 };
      }

      function maakTextuur(regels, maat) {
        const c = document.createElement("canvas");
        c.width = Math.round(W * dpr);
        c.height = Math.round(H * dpr);
        const g = c.getContext("2d");
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.font = "700 " + maat + "px " + FONT;
        g.fillStyle = "#000";
        g.textAlign = "center";
        g.textBaseline = "middle";
        regels.forEach(function (r, i) {
          const y = H / 2 + (i - (regels.length - 1) / 2) * maat * LH;
          g.fillText(r, W / 2, y);
        });

        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return tex;
      }

      function init() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        gl.viewport(0, 0, canvas.width, canvas.height);

        const titel = bereken(TITEL, 0.92);
        texTitel = maakTextuur(TITEL, titel.maat);

        // De dagen krijgen links en rechts ruimte voor de informatie
        const deel = W >= 760 ? 0.6 : 0.92;
        const woorden = bereken(WOORDEN, deel);
        texWoorden = maakTextuur(WOORDEN, woorden.maat);

        bandLh = woorden.maat * LH;
        bandTop = H / 2 - (WOORDEN.length / 2) * bandLh;

        const marge = (W - woorden.breedte) / 2;
        smal = marge - 48 < 150;

        if (smal) {
          infoL.style.left = "20px";
          infoL.style.width = (W - 40) + "px";
          infoL.style.top = "auto";
          infoL.style.bottom = "90px";
          infoR.style.left = "20px";
          infoR.style.width = (W - 40) + "px";
          infoR.style.top = "auto";
          infoR.style.bottom = "28px";
          infoL.style.transform = "none";
          infoR.style.transform = "none";
        } else {
          infoL.style.left = "24px";
          infoL.style.width = (marge - 48) + "px";
          infoR.style.left = (W / 2 + woorden.breedte / 2 + 24) + "px";
          infoR.style.width = (marge - 48) + "px";
          infoL.style.bottom = "auto";
          infoR.style.bottom = "auto";
          infoL.style.transform = "translateY(-50%)";
          infoR.style.transform = "translateY(-50%)";
        }
      }

      function toonInfo(idx) {
        if (idx < 0) {
          infoL.classList.remove("aan");
          infoR.classList.remove("aan");
          return;
        }
        const d = INFO[idx];
        infoL.innerHTML = "<b>" + d.naam + "</b>Prijs: " + d.prijs + "<br>Smaak: " + d.smaak;
        infoR.textContent = d.tekst;
        if (!smal) {
          const y = (bandTop + (idx + 0.5) * bandLh) + "px";
          infoL.style.top = y;
          infoR.style.top = y;
        }
        infoL.classList.add("aan");
        infoR.classList.add("aan");
      }

      function frame(ts) {
        const now = ts / 1000;
        const el = t0 === null ? 0 : now - t0;

        let tex = texTitel;
        let ambient = 0;
        let vanish = 0;
        let rise = 120;
        let bandAan = 0;
        const smelt = clamp(el / GOLFTIJD, 0, 1);

        // Na een tweetal seconden bij de dagen stoppen de golven
        const golfLeven = 1 - clamp((el - DAGSTART - GOLFSTOP) / 0.7, 0, 1);

        if (el < GOLFTIJD) {
          ambient = smelt * smelt * 28;
        } else if (el < DAGSTART) {
          vanish = (el - GOLFTIJD) / VERDAMPTIJD;
          ambient = 28 + vanish * 14;
        } else {
          tex = texWoorden;
          bandAan = 1;
          const intro = clamp((el - DAGSTART) / INTROTIJD, 0, 1);
          vanish = 1 - intro;
          rise = -80;
          ambient = (1 - intro) * (1 - intro) * 24 * golfLeven;
        }

        // Hover-effect: de andere dagen worden half doorzichtig
        for (let i = 0; i < 4; i++) {
          const doel = hover < 0 || hover === i ? 1 : 0.5;
          opNu[i] += (doel - opNu[i]) * 0.15;
        }

        // Hint na het verschijnen van de dagen
        if (!hintGezet && el >= DAGSTART + INTROTIJD) {
          hintGezet = true;
          hint.textContent = "Beweeg over een dag";
          hint.style.opacity = 1;
        }

        // Golven doorgeven aan de shader
        ripData.fill(0);
        for (let i = 0; i < MAX_GOLVEN; i++) ripData[i * 4 + 2] = -1000;
        for (let i = 0; i < golven.length; i++) {
          const g = golven[i];
          ripData[i * 4] = g.x;
          ripData[i * 4 + 1] = g.y;
          ripData[i * 4 + 2] = g.t;
          ripData[i * 4 + 3] = 9 * (1 + smelt * 1.6) * golfLeven;
        }

        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.uniform1i(U.uTex, 0);
        gl.uniform2f(U.uRes, canvas.width, canvas.height);
        gl.uniform1f(U.uDpr, dpr);
        gl.uniform1f(U.uTime, now);
        gl.uniform1f(U.uAmbient, ambient);
        gl.uniform1f(U.uVanish, vanish);
        gl.uniform1f(U.uRise, rise);
        gl.uniform3f(U.uBand, bandTop, bandLh, bandAan);
        gl.uniform4f(U.uOp, opNu[0], opNu[1], opNu[2], opNu[3]);
        gl.uniform4fv(U.uRip, ripData);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        requestAnimationFrame(frame);
      }

      function beweeg(e) {
        const now = performance.now() / 1000;
        if (t0 === null) {
          t0 = now;
          hint.style.opacity = 0;
        }
        const el = now - t0;

        // Golven maken (stopt bij de dagen)
        if (el < DAGSTART + GOLFSTOP) {
          const afstand = Math.hypot(e.clientX - laatste.x, e.clientY - laatste.y);
          if (afstand > 14 && now - laatste.t > 0.06) {
            golven.push({ x: e.clientX, y: e.clientY, t: now });
            if (golven.length > MAX_GOLVEN) golven.shift();
            laatste = { x: e.clientX, y: e.clientY, t: now };
          }
        }

        // Hover over een dag
        if (el >= DAGSTART + INTROTIJD) {
          let idx = Math.floor((e.clientY - bandTop) / bandLh);
          if (idx < 0 || idx > 3) idx = -1;
          if (idx !== hover) {
            hover = idx;
            toonInfo(idx);
          }
          if (idx >= 0) hint.style.opacity = 0;
        }
      }

      window.addEventListener("pointermove", beweeg);
      window.addEventListener("pointerdown", beweeg);

      document.documentElement.addEventListener("mouseleave", function () {
        hover = -1;
        toonInfo(-1);
      });

      let resizeTimer;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(init, 200);
      });

      init();
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
